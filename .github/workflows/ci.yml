name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable  # newest Go: binaries get the latest standard-library fixes
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: unit tests
        run: go test -race -count=1 ./...
      - name: integration tests (Postgres 17 in docker)
        run: PGBISYNC_IT=1 go test -count=1 -timeout 30m ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
