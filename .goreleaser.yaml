version: 2

project_name: pg-bisync

builds:
  - main: ./cmd/pg-bisync
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - examples/*

checksum:
  name_template: checksums.txt
